<div class="welcome">
  <div class="welcome__logo">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="20" fill="#58a6ff" opacity="0.15"/>
      <circle cx="20" cy="12" r="4" fill="#58a6ff"/>
      <circle cx="12" cy="28" r="4" fill="#3fb950"/>
      <circle cx="28" cy="28" r="4" fill="#f78166"/>
      <line x1="20" y1="16" x2="12" y2="24" stroke="#58a6ff" stroke-width="2"/>
      <line x1="20" y1="16" x2="28" y2="24" stroke="#58a6ff" stroke-width="2"/>
    </svg>
    <h1 class="welcome__title">RefLens</h1>
    <p class="welcome__subtitle">Git Visualizer — merge conflicts, rebase & cherry-pick made visual</p>
  </div>

  <button class="btn btn--primary" (click)="openRepository()" [disabled]="loading">
    <span *ngIf="!loading">Open Repository</span>
    <span *ngIf="loading">Opening…</span>
  </button>

  <div class="welcome__recent" *ngIf="recentRepos.length > 0">
    <h3 class="welcome__recent-title">Recent Repositories</h3>
    <ul class="recent-list">
      <li *ngFor="let repo of recentRepos" class="recent-list__item" (click)="openRecent(repo)">
        <span class="recent-list__icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>
          </svg>
        </span>
        <span class="recent-list__name">{{ repo.name }}</span>
        <span class="recent-list__path">{{ repo.path }}</span>
      </li>
    </ul>
  </div>
</div>
