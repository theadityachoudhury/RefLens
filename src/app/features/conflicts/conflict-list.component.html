<div class="conflict-list-page">
  <header class="page-header">
    <div class="page-header__left">
      <div class="page-header__icon conflict">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8.22 1.754a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm-1.763-.707c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm-.25-5.25a.75.75 0 0 0-1.5 0v2.5a.75.75 0 0 0 1.5 0Z"/>
        </svg>
      </div>
      <div>
        <h1 class="page-header__title">Merge Conflicts</h1>
        <p class="page-header__subtitle">
          {{ conflictService.files().length }} file{{ conflictService.files().length !== 1 ? 's' : '' }} with conflicts
        </p>
      </div>
    </div>
    <div class="page-header__actions">
      <button class="btn btn--danger" (click)="abort()">Abort</button>
      <button
        class="btn btn--primary"
        [disabled]="!conflictService.allResolved()"
        (click)="completeMerge()">
        Complete Merge
      </button>
    </div>
  </header>

  <div *ngIf="conflictService.loading()" class="loading-state">
    <div class="spinner"></div>
    <span>Loading conflict files…</span>
  </div>

  <ul *ngIf="!conflictService.loading()" class="file-list">
    <li *ngFor="let file of conflictService.files(); let i = index"
        class="file-list__item"
        [class.file-list__item--resolved]="isResolved(file.path)"
        (click)="openFile(i)">
      <span class="file-list__status-icon">
        <ng-container *ngIf="isResolved(file.path)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#3fb950">
            <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/>
          </svg>
        </ng-container>
        <ng-container *ngIf="!isResolved(file.path)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#f78166">
            <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
          </svg>
        </ng-container>
      </span>
      <span class="file-list__path">{{ file.path }}</span>
      <span class="file-list__hunks">{{ file.hunks.length }} conflict{{ file.hunks.length !== 1 ? 's' : '' }}</span>
      <span class="file-list__arrow">›</span>
    </li>
  </ul>
</div>
